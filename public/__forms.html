<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <title>HSM Aries form definitions</title>
  </head>
  <body>
    <form name="join-aries" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="join-aries" />
      <input name="bot-field" />
      <input name="first-name" />
      <input name="surname" />
      <input name="email" type="email" />
      <input name="study-program" />
      <input name="semester" />
      <input name="division-preference" />
      <textarea name="motivation"></textarea>
    </form>

    <form name="partnership-enquiry" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="partnership-enquiry" />
      <input name="bot-field" />
      <input name="first-name" />
      <input name="surname" />
      <input name="company" />
      <input name="email" type="email" />
      <input name="partnership-scope" />
      <textarea name="message"></textarea>
    </form>

    <form name="general-contact" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="general-contact" />
      <input name="bot-field" />
      <input name="first-name" />
      <input name="surname" />
      <input name="email" type="email" />
      <textarea name="message"></textarea>
    </form>
  </body>
</html>
