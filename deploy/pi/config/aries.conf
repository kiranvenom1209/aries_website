# /etc/aries-host/aries.conf – settings of the HSM Aries website on this Pi (install.sh copies it there once; later
# edits on the Pi stay). No secrets in here: those live in /srv/aries/shared/.env and /etc/aries-host/secrets/.

# the repository and branch the Pi deploys, and the workflow that builds it (.github/workflows/pi-build.yml)
REPO="kiranvenom1209/aries_website"
BRANCH="main"
WORKFLOW="pi-build.yml"

# local port of the site – 127.0.0.1 only (the Stegmann site uses 4321)
PORT="4330"

# public hostnames for the named tunnel; the first one is the site's address
HOSTNAMES="hsmaries.space www.hsmaries.space"
# name of the tunnel in the team's Cloudflare account
TUNNEL_NAME="hsm-aries"

# releases kept for a rollback; seconds a new release gets to answer its health check
KEEP_RELEASES="5"
HEALTH_WAIT_SEC="180"

# optional: Healthchecks.io ping URL – an e-mail when the Pi or the site is down (bin/health.sh, every 5 minutes)
HC_PING_URL=""
